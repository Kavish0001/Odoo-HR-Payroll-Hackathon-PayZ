<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <!--
    Simplified PayZ mark for small sizes (favicon, navbar, tab icon).

    The full coin (payz-icon.svg) carries a brush pattern, a reeded edge and
    three machining rings. Below roughly 48px those collapse into grey mud and
    the shape stops reading. This keeps only what survives at 16px: the coin
    silhouette, the gunmetal gradient, the engraved grille, and the red mint
    mark that makes it identifiable in a crowded tab strip.
  -->
  <defs>
    <radialGradient id="face" cx="35%" cy="28%" r="78%">
      <stop offset="0" stop-color="#F7F8F9"/>
      <stop offset=".3" stop-color="#D9DCE0"/>
      <stop offset=".6" stop-color="#9EA3A9"/>
      <stop offset=".85" stop-color="#5C6167"/>
      <stop offset="1" stop-color="#2B2E33"/>
    </radialGradient>

    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F6F7"/>
      <stop offset=".45" stop-color="#6B7076"/>
      <stop offset="1" stop-color="#2E3237"/>
    </linearGradient>

    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF4A4A"/>
      <stop offset="1" stop-color="#A90000"/>
    </linearGradient>
  </defs>

  <!-- coin body -->
  <circle cx="500" cy="500" r="470" fill="url(#edge)"/>
  <circle cx="500" cy="500" r="415" fill="url(#face)"/>
  <circle cx="500" cy="500" r="415" fill="none" stroke="#202328" stroke-opacity=".55" stroke-width="10"/>

  <!-- engraved grille: eight slots, tallest at centre -->
  <g fill="#1B1E22" stroke="#E9EBED" stroke-opacity=".5" stroke-width="3">
    <rect x="392" y="458" width="15" height="84" rx="7"/>
    <rect x="421" y="423" width="15" height="154" rx="7"/>
    <rect x="450" y="388" width="15" height="224" rx="7"/>
    <rect x="479" y="358" width="15" height="284" rx="7"/>
    <rect x="508" y="358" width="15" height="284" rx="7"/>
    <rect x="537" y="388" width="15" height="224" rx="7"/>
    <rect x="566" y="423" width="15" height="154" rx="7"/>
    <rect x="595" y="458" width="15" height="84" rx="7"/>
  </g>

  <!-- red mint mark -->
  <path d="M430 782 Q500 800 570 782 L562 838 Q500 856 438 838 Z"
        fill="url(#mint)"/>
</svg>
