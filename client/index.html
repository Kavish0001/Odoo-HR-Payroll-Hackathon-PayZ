<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- One mark everywhere: tab strip, navbar, login and PDF all use it. -->
    <link rel="icon" type="image/svg+xml" href="/payz-logo.svg" />
    <link rel="apple-touch-icon" href="/payz-logo.svg" />
    <link rel="mask-icon" href="/payz-logo.svg" color="#A90000" />
    <meta name="theme-color" content="#2B2E33" />

    <!-- Preload only the two faces above the fold; the rest arrive with the
         stylesheet and swap in without shifting layout. -->
    <link
      rel="preload"
      href="/fonts/Inter-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/JetBrainsMono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      name="description"
      content="PayZ - integrated HR and payroll platform: employees, contracts, attendance, time off and payroll."
    />

    <title>PayZ - HR &amp; Payroll</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
