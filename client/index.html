<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Simplified mark for the tab strip; the full coin has machining detail
         that turns to mud below ~48px. -->
    <link rel="icon" type="image/svg+xml" href="/payz-mark.svg" />
    <link rel="apple-touch-icon" href="/payz-icon.svg" />
    <link rel="mask-icon" href="/payz-mark.svg" color="#A90000" />
    <meta name="theme-color" content="#2B2E33" />

    <!-- Preload only the two faces above the fold; the rest arrive with the
         stylesheet and swap in without shifting layout. -->
    <link
      rel="preload"
      href="/fonts/SpaceGrotesk-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/SpaceMono-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <meta
      name="description"
      content="PayZ - integrated HR and payroll platform: employees, contracts, attendance, time off and payroll."
    />

    <title>PayZ - HR &amp; Payroll</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
