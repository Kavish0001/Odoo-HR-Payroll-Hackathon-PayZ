services:
  db:
    image: postgres:17-alpine
    container_name: payz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: payz
      POSTGRES_PASSWORD: payz
      POSTGRES_DB: payz
    ports:
      # 5433 on the host: 5432 is taken by an existing container on this machine.
      - '5433:5432'
    volumes:
      - payz-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U payz -d payz']
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: payz-adminer
    restart: unless-stopped
    # 8081 on the host: 8080 is taken by an existing container on this machine.
    ports:
      - '8081:8080'
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  payz-pgdata:
