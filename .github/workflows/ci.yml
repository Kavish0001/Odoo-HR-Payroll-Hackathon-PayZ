name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A hundred pushes should not queue a hundred builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  quality:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w server db:generate

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artefact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: payz-build
          path: |
            client/dist
            server/dist
          retention-days: 7

  test:
    name: Test
    runs-on: ubuntu-latest

    # Real Postgres, because the exclusion constraint that makes overlapping
    # running contracts impossible is only proven against real Postgres.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payz
          POSTGRES_PASSWORD: payz
          POSTGRES_DB: payz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payz -d payz_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://payz:payz@localhost:5432/payz_test?schema=public
      JWT_SECRET: ci-secret-key-that-is-at-least-32-characters-long
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma client
        run: npm run -w server db:generate

      - name: Migrate test database
        run: npm run -w server db:deploy

      - name: Test
        run: npm run test
